# Jekyll settings. GitHub Pages builds the site from this repository automatically.
# Jekyll is used for the essays (_posts, writing.html), the explainers (_explainers, explainers.html)
# and the list of explainers on research.html; every other page is plain HTML.
title: Saurabh
description: "Saurabh (relativist1), theoretical astrophysicist: postdoc in AI³ at the BASP lab, Heriot-Watt University, and Event Horizon Telescope member."
author: Saurabh
url: https://relativist1.github.io
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
permalink: /writing/:year/:title/
exclude: [README.md, WRITING.md, EXPLAINERS.md, _drafts]
collections:
  explainers:
    output: true
    permalink: /explainers/:name/
defaults:
  - scope: {path: "", type: explainers}
    values: {layout: explainer}
